name: Rank-up alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: rankups
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy key: lets the bot push state.json to protected main
          # (it's a ruleset bypass actor; GITHUB_TOKEN can't be one on
          # a user-owned repo).
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Check for rank-ups
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WOM_VERIFICATION_CODE: ${{ secrets.WOM_VERIFICATION_CODE }}
          WOM_API_KEY: ${{ secrets.WOM_API_KEY }}
        run: python3 -u rankup_bot.py

      - name: Commit updated state
        run: |
          git config user.name "nwk-rankup-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          fi
